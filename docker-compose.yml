services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowpilot}
      POSTGRES_USER: ${POSTGRES_USER:-flowpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowpilot_local_dev_only}
    ports:
      - "127.0.0.1:5433:5432"    
    volumes:
      - flowpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowpilot} -d ${POSTGRES_DB:-flowpilot}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://flowpilot:flowpilot_local_dev_only@db:5432/flowpilot}
      INVOICE_DIR: /app/sample_data
    ports:
      - "8000:8000"
    volumes:
      - ./sample_data:/app/sample_data:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  flowpilot_pgdata:
